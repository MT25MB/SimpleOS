appId: org.simpleos.shell
productName: SimpleOS Shell
copyright: Copyright (c) 2026 SimpleOS contributors

directories:
  output: release

# Produce an unpackaged directory rather than an AppImage. This keeps the
# launcher easy to inspect, drop into the immutable image, and update.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

linux:
  target: dir
  category: Utility
