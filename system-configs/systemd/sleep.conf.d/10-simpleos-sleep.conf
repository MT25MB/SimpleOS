# SimpleOS sleep defaults
# -----------------------------------------------------------------------------
# Normal suspend is allowed so the machine can still save power when something
# else asks it to. Hibernation and hybrid sleep are turned off because coming
# back from them can produce a confusing or half-awake desktop.
# -----------------------------------------------------------------------------

[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
