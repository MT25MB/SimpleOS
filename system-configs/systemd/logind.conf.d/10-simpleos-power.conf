# SimpleOS power defaults
# -----------------------------------------------------------------------------
# A calm computer is one that is always there when you look at it. Automatic
# suspend, lid switches and power-button events are the main reasons an older
# computer appears "dead". We disable those surprises here rather than trying
# to detect video calls in userspace.
#
# This is a drop-in: every other systemd default stays untouched.
# -----------------------------------------------------------------------------

[Login]
# Closing the lid must never blank the screen, on battery or on the dock.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# Leaving the computer alone must not suspend it mid-call or mid-sentence.
IdleAction=ignore

# A stray press of the power/suspend/hibernate key must not shut anything down.
# A long press still powers off at the firmware level, so help is always possible.
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
