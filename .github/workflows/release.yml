# Publish a GitHub Release for a version tag, or on demand with a version input.
# The quality gate must pass before a release is created. Each release also ships
# a bootable ISO built from the exact image the tag represents; the installed
# system tracks :latest so updates keep working after installation.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.3.0'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/simpleos

jobs:
  test:
    name: Quality gate
    uses: ./.github/workflows/test.yml

  release:
    name: Publish GitHub Release
    needs: test
    # bootc-image-builder's osbuild uses bwrap, which Ubuntu 26.04's AppArmor
    # profile blocks during privileged mounts. Pin the ISO build to 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like v0.3.0, got: $VERSION" >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure the tag exists
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; using it."
          else
            git tag -a "$VERSION" -m "SimpleOS $VERSION"
            git push origin "$VERSION"
            echo "Created tag $VERSION."
          fi

      - name: Find the previous release tag
        id: previous
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          PREVIOUS="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -v "^$VERSION$" | head -n 1 || true)"
          echo "value=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PREVIOUS: ${{ steps.previous.outputs.value }}
        run: |
          bash scripts/generate-release-notes.sh "$VERSION" "$PREVIOUS" > release-notes.md
          echo "--- generated notes (first 40 lines) ---"
          head -n 40 release-notes.md

      # Build and publish the image here so the version tag advertised in the
      # notes really exists and the ISO is built from the tagged commit, even on
      # a workflow_dispatch re-run of an older release.
      - name: Normalize the GHCR image name
        id: image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: echo "name=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the version-tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: os-image/Containerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}

      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Verify the kiosk session is enabled
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          REF="$(printf '%s' "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')"
          sudo podman pull "$REF"
          sudo podman run --rm --entrypoint /bin/sh "$REF" -c \
            'test -L /etc/systemd/system/graphical.target.wants/greetd.service \
              && test -L /etc/systemd/system/display-manager.service \
              && test -x /usr/libexec/simpleos/simpleos-shell \
              && test -x /usr/libexec/simpleos/firstboot.sh \
              && test "$(readlink -f /etc/systemd/system/default.target)" = /usr/lib/systemd/system/graphical.target \
              && id -u senior \
              && id -u greeter \
              && command -v labwc \
              && grep -q "useradd --no-create-home --groups video greeter" /etc/simpleos/firstboot.sh \
              && grep -q "<action name=\"None\"/>" /etc/xdg/labwc/rc.xml'
          echo "greetd, both session users, labwc and the launcher are wired up."

      - name: Build the release ISO
        id: iso
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          TARGET_REF="${REGISTRY}/${IMAGE_NAME}:latest"
          # GHCR package names are lowercase even when the GitHub owner is not.
          IMAGE_REF="$(printf '%s' "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')"
          TARGET_REF="$(printf '%s' "$TARGET_REF" | tr '[:upper:]' '[:lower:]')"

          sudo podman pull "$IMAGE_REF"
          ISO_DIR="$RUNNER_TEMP/simpleos-iso"
          mkdir -p "$ISO_DIR"
          SIMPLEOS_ASSUME_YES=1 TARGET_IMAGE_REF="$TARGET_REF" \
            bash scripts/build-iso.sh --image "$IMAGE_REF" --output "$ISO_DIR"

          ISO_PATH="$(find "$ISO_DIR" -type f -name '*.iso' -print -quit)"
          [[ -n "$ISO_PATH" && -s "$ISO_PATH" ]] || {
            echo "No usable ISO was produced." >&2
            exit 1
          }
          ISO_NAME="SimpleOS-${VERSION}.iso"
          # bootc-image-builder writes the ISO as root, so the runner user needs
          # sudo to rename it and to take ownership for the steps below.
          sudo mv "$ISO_PATH" "$ISO_DIR/$ISO_NAME"
          sudo chown "$(id -u):$(id -g)" "$ISO_DIR/$ISO_NAME"
          ls -lh "$ISO_DIR/$ISO_NAME"

          # GitHub Free caps a single release asset at 2 GB. The installer is
          # larger, so ship it as numbered parts plus a checksum.
          (
            cd "$ISO_DIR"
            split -b 1500m -d -a 1 "$ISO_NAME" "${ISO_NAME}.part"
            sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          )
          ISO_PARTS="$(find "$ISO_DIR" -maxdepth 1 -type f -name "${ISO_NAME}.part*" -printf '%f\n' | sort | tr '\n' ' ')"
          [[ -n "$ISO_PARTS" ]] || {
            echo "ISO splitting produced no parts." >&2
            exit 1
          }
          echo "Prepared parts: $ISO_PARTS"
          echo "parts=$ISO_PARTS" >> "$GITHUB_OUTPUT"
          echo "name=$ISO_NAME" >> "$GITHUB_OUTPUT"

      - name: Create ISO combine scripts
        id: combine
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ISO_PARTS: ${{ steps.iso.outputs.parts }}
          ISO_NAME: ${{ steps.iso.outputs.name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ISO_DIR="$RUNNER_TEMP/simpleos-iso"
          COPY_ARGS=""
          for part in $ISO_PARTS; do
            if [[ -z "$COPY_ARGS" ]]; then
              COPY_ARGS="\"$part\""
            else
              COPY_ARGS="$COPY_ARGS+\"$part\""
            fi
          done
          printf '%s\r\n' \
            '@echo off' \
            'setlocal' \
            'cd /d "%~dp0"' \
            "echo Joining SimpleOS ${VERSION} ISO parts..." \
            "if exist \"${ISO_NAME}\" del \"${ISO_NAME}\"" \
            "copy /b ${COPY_ARGS} \"${ISO_NAME}\"" \
            'if errorlevel 1 goto :fail' \
            "if exist \"${ISO_NAME}.sha256\" certutil -hashfile \"${ISO_NAME}\" SHA256" \
            'echo.' \
            "echo Compare the hash above with the value in ${ISO_NAME}.sha256" \
            "echo Then use ${ISO_NAME} as your VM boot CD/DVD." \
            'pause' \
            'exit /b 0' \
            ':fail' \
            'echo FAILED to join the parts. Check that all parts are in this folder.' \
            'pause' \
            'exit /b 1' \
            > "$ISO_DIR/combine-iso-parts.bat"
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            echo 'cd "$(dirname "$0")"'
            echo "echo \"Joining SimpleOS ${VERSION} ISO parts...\""
            printf 'cat %s > %s\n' "$ISO_PARTS" "$ISO_NAME"
            echo "sha256sum -c ${ISO_NAME}.sha256"
            echo "echo \"Done: ${ISO_NAME} - use it in your VM or flash it to USB.\""
          } > "$ISO_DIR/combine-iso-parts.sh"
          chmod +x "$ISO_DIR/combine-iso-parts.sh"
          ls -l "$ISO_DIR/combine-iso-parts."*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; updating its notes."
            gh release edit "$VERSION" --notes-file release-notes.md --title "SimpleOS $VERSION"
          else
            gh release create "$VERSION" \
              --title "SimpleOS $VERSION" \
              --notes-file release-notes.md \
              --target main
          fi

      - name: Attach the ISO parts to the release
        id: upload
        if: steps.iso.outputs.parts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          ISO_PARTS: ${{ steps.iso.outputs.parts }}
          ISO_NAME: ${{ steps.iso.outputs.name }}
          ISO_DIR: ${{ runner.temp }}/simpleos-iso
        run: |
          read -r -a PARTS <<< "$ISO_PARTS"
          for part in "${PARTS[@]}"; do
            [[ -s "$ISO_DIR/$part" ]] || { echo "Missing ISO part: $part" >&2; exit 1; }
          done
          ASSETS=()
          for part in "${PARTS[@]}"; do ASSETS+=("$ISO_DIR/$part"); done
          gh release upload "$VERSION" \
            "${ASSETS[@]}" \
            "$ISO_DIR/$ISO_NAME.sha256" \
            "$ISO_DIR/combine-iso-parts.bat" \
            "$ISO_DIR/combine-iso-parts.sh" \
            --clobber
          echo "Attached ${#ASSETS[@]} ISO parts, a checksum and combine scripts to $VERSION."

      - name: Link the attached ISO in the release notes
        if: steps.iso.outputs.parts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          PREVIOUS: ${{ steps.previous.outputs.value }}
          ISO_ASSET: ${{ steps.iso.outputs.name }}
        run: |
          bash scripts/generate-release-notes.sh "$VERSION" "$PREVIOUS" "$ISO_ASSET" > release-notes.md
          gh release edit "$VERSION" --notes-file release-notes.md --title "SimpleOS $VERSION"
