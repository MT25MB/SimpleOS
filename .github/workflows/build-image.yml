# SimpleOS continuous integration.
# Rebuilds the immutable base image on every push to main and once a week, then
# publishes it to GitHub Container Registry (ghcr.io). Uses only free GH runners.
name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC — catches upstream uBlue package drift.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/simpleos

jobs:
  build-image:
    name: Build and push SimpleOS image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: os-image/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  check-shell:
    name: Type-check and build helper shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simpleos-shell
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Fail loudly if package.json and package-lock.json ever drift apart.
        run: npm ci

      - name: Build
        run: npm run build
