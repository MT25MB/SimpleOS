name: Bug Report
description: Something in SimpleOS does not work the way it should
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please write in plain language —
        tell us what you were trying to do and what got in the way.

        If this is a security problem or a way to escape the kiosk, do **not** use
        this form. Follow [SECURITY.md](https://github.com/MT25MB/SimpleOS/blob/main/SECURITY.md) instead.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what you saw, in your own words.
      placeholder: The screen went blank when I pressed Daily Reminders.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: I expected the list of reminders to open.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: Numbered steps are ideal. Tell us if it only happens sometimes.
      placeholder: |
        1. Start the computer and wait for the launcher.
        2. Press Daily Reminders.
        3. The screen goes blank.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Launcher or home screen
        - Daily Reminders
        - Caregiver Settings or PIN
        - Wi-Fi or Bluetooth
        - Printers or sound
        - Screen brightness or battery
        - Image build or first boot
        - Website or caregiver guide
        - Scripts, ISO or CI
        - Somewhere else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Which version were you using?
      description: A release tag or commit makes this much easier to track.
      placeholder: "v0.2.0, or main at 80110ab"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Anything else that might help?
      description: Error messages, screenshots, or what you tried already.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you finish
      options:
        - label: This is not a security issue or a kiosk escape
          required: true
        - label: I ran `bash scripts/test-all.sh` and it passed, if this is a code change
          required: false
